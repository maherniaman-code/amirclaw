# Meydan Reports Automation Rules Configuration
# All configurations are editable without changing code.

groups:
  parking_multistory: "Multistory Parking Building Meydan"
  parking_team: "Parking Team at Meydan"
  fm: "Meydan FM Team💪"
  fire_safety: "Fire & Safety Team Meydan"
  operations: "Meydan - Security Team"
  cleaning: "cleaning matters at meydan"

# Parking capacities
capacities:
  buildings:
    P: 71
    N: 77
    M: 165
    Q: 146
    total: 459
  ramp: 127
  service_road: 127 # Fixed at 127. Any other value reported in WA is flagged in diagnostics.
  smart_parking: 887

# Time settings (Asia/Dubai)
timing:
  timezone: "Asia/Dubai"
  parking_slots: ["10:00", "12:00", "14:00"]
  freshness_window_minutes: 60
  email_slot_tolerance_minutes: 5 # Configurable tolerance for matching email timestamp to slot (±5 mins)
  email_poll_interval_seconds: 60
  email_poll_timeout_minutes: 5
  shifts:
    day:
      start: "05:00"
      end: "17:00"
      report_time: "17:00"
    night:
      start: "17:00"
      end: "05:00"
      report_time: "05:00"

exclude:
  senders:
    - "Me (Bot Account)"
    - "أنا (حساب البوت)"
  exact_replies:
    - "noted"
    - "noted sir"
    - "ok"
    - "recorded"
    - "received"
    - "again"
    - "thanks sir"
    - "👍"
    - "clear"
    - "all clear"
  leave_markers:
    - "leave details"
    - "start date"
    - "staff id"
    - "staff is"
    - "emp id"
    - "total days"
    - "annual leave"
    - "taking leave"
    - "on leave"
    - "leave request"

fault:
  - "not working"
  - "not opening"
  - "not closing"
  - "not cold"
  - "not stable"
  - "blinking"
  - "shaking"
  - "hanging"
  - "loose"
  - "need to check"
  - "need to fix"
  - "need to rectify"
  - "need to increase"
  - "require maintenance"
  - "electrical power issue"
  - "cooling is very low"
  # Same fault wording guards use in the Security Team group (operations.fault_markers)
  - "out of service"
  - "out of order"
  - "not functioning"
  - "not responding"
  - "malfunction"
  - "faulty"
  - "stuck"
  - "jammed"
  - "leak"
  - "broken"
  - "damaged"
  - "cracked"
  - "tripped"
  - "no power"
  - "power cut"
  - "power failure"
  - "not cooling"
  - "low cooling"
  - "flickering"
  - "glowing"
  - "need to replace"
  - "needs repair"
  - "need repair"

closure:
  - "done"
  - "resolved"
  - "light replaced"
  - "replaced"
  - "rectified"
  - "cleaned"
  - "mopped"
  - "cleared"
  - "area cleared"
  - "spill removed"
  - "all clear"

# Whole-message closures: only when the reply is exactly one of these.
# "working ..." phrases must NOT go in `closure` above: a fault saying "not working properly"
# would then be read as a negated closure (follow-up) and the ticket would be lost.
closure_exact:
  - "working"
  - "working now"
  - "now working"
  - "working fine"
  - "working properly"
  - "working normally"
  - "fixed"
  - "fixed now"
  - "solved"
  - "ok now"
  - "all good"

# Unquoted replies link to the open ticket sharing a word within reply_link_hours
# ("Light replaced" -> "...light not working..."), else to the latest open ticket
# within reply_link_minutes.
reply_link_hours: 12
reply_link_minutes: 60

in_progress:
  - "checking"
  - "notified to"
  - "will replace"
  - "pls check and update"
  - "is on going"
  - "is ongoing"
  - "in progress"
  - "will clean"
  - "will mop"
  - "team is checking"

followup_not_ticket:
  - "follow up"
  - "is it restored"
  - "urgent action required"
  - "daily issues"

building_regex: "\\b(?:(?:building|bldg|block|gate|tower|zone)\\s*[:-]?\\s*([PNMQ])|([PNMQ])\\s*[:-]?\\s*(?:building|bldg|block|gate|tower|zone|level))\\b"
floor_regex: "(ground floor|\\bgf\\b|\\d+(?:st|nd|rd|th)?\\s*floor|level\\s*\\d+)"

teams:
  - "imdaad"
  - "imdad"
  - "avs"
  - "kone"

safety_priority:
  - "emergency exit"
  - "exit light"
  - "fire exit"
  - "fire fighting"
  - "fire pump"
  - "barrier"
  - "gate"
  - "hanging"
  - "loose"
  - "hazard"

operations:
  # Every keyword list below matches at the START of a word, so a root
  # covers every form: "remov" -> remove/removed/removing/removal. Matching is case-insensitive.
  # Seeded from the Security Team messages of 11-14 Oct 2026, then widened to common
  # contractor / facility scenarios. tests/test_reports_engine.py has a scenario table:
  # add a case there whenever you add a keyword.

  # Named companies. The first match becomes the "vendor" shown in the report.
  vendors:
    - "telecon"
    - "fit movers"
    - "arki"
    - "housekeeping"
    - "rose garden"
    - "kone"
    - "imdaad"
    - "al zawaya"
    - "eurosec"
    # Common Dubai FM / lift / utility / pest-control providers
    - "emrill"
    - "farnek"
    - "transguard"
    - "enova"
    - "khidmah"
    - "serco"
    - "otis"
    - "schindler"
    - "mitsubishi elevator"
    - "dewa"
    - "etisalat"
    - "rentokil"
    - "g4s"
    - "honeywell"
    - "johnson controls"
    - "siemens"
  # Other spellings guards use -> canonical vendor name above
  vendor_aliases:
    "house keeping": "housekeeping"
    "house-keeping": "housekeeping"
    "alzawaya": "al zawaya"
    "al-zawaya": "al zawaya"
    "al zawiya": "al zawaya"
    "imdad ": "imdaad"
    "rose garden team": "rose garden"
    "e&": "etisalat"

  # An activity that names no company takes the vendor of the latest activity that does,
  # within this many minutes (follow-up posts of the same job). 0 disables it.
  vendor_inherit_minutes: 60

  # Someone doing work without a company name. Counts like a vendor for the fault rule
  # but is shown as "Operations Team".
  parties:
    - "vendor"            # vendor / vendors
    - "contractor"
    - "subcontractor"
    - "supplier"
    - "courier"
    - "technician"
    - "workers"
    - "labour"
    - "labor"
    - "company staff"
    - "maintenance team"
    - "cleaning team"
    - "pest control"

  # What is being done
  activities:
    # install / remove / replace
    - "install"
    - "uninstall"
    - "remov"
    - "taking out"
    - "took out"
    - "replac"
    - "dismantl"
    - "assembl"
    - "mounting"
    - "mounted"
    - "fixing"
    - "fixed"
    - "repair"
    - "upgrad"
    # moving goods and furniture
    - "shifted"
    - "shifting"
    - "move "
    - "moved"
    - "moving"
    - "relocat"
    - "transferr"
    - "placed"
    - "placing"
    - "carrying"
    - "carried"
    - "deliver"
    - "load"
    - "unload"
    - "offload"
    - "pick up"
    - "picked up"
    - "pickup"
    - "drop off"
    - "dropped off"
    - "collect"
    - "dispos"
    - "taking away"
    # fit-out and civil work
    - "paint"
    - "drilling"
    - "welding"
    - "hot work"
    - "cutting"
    - "cabling"
    - "wiring"
    - "carpet"
    - "partition"
    - "plaster"
    - "tiling"
    # signage and events
    - "poster"
    - "sticker"
    - "signage"
    - "banner"
    - "branding"
    - "setup"
    - "set up"
    - "setting up"
    - "arranging"
    - "decorat"
    # cleaning, pest control, landscaping
    - "cleaning"
    - "deep clean"
    - "fumigat"
    - "spraying"
    - "watering"
    - "landscap"
    - "trimming"
    - "pruning"
    - "planting"
    - "grass cutting"
    # servicing, testing, visits
    - "servicing"
    - "serviced"
    - "testing"
    - "inspection"
    - "auditing"          # not bare "audit": it would match "auditorium"
    - "audit by"
    - "audit team"
    - "site visit"
    - "meter reading"
    - "escorting"
    - "work permit"
    - "permit to work"
    - "ptw"
    - "sign-in"
    - "sign in"

  # Marks an activity Completed (ignored when negated: "not yet completed").
  # A completion message closes the earlier activity it refers to (quoted, or sharing a word).
  completion:
    - "complet"
    - "done"
    - "finish"
    - "work is over"
    - "wrapped up"
    - "handed over"
    - "vendors left"
    - "vendor left"
    - "vendor has left"
    - "team left"
    - "staff left"
    - "workers left"
    - "they left"
    - "has left"
    - "have left"
    - "left the site"
    - "left the premises"
    - "left the building"
    - "left the area"
    - "cleared"

  # Guards' fault reports (lights, AC, gates, card readers, leaks) belong to maintenance.
  # A message with one of these is left out unless it names a vendor/party AND an activity.
  fault_markers:
    - "not working"
    - "not work"
    - "not functioning"
    - "malfunction"
    - "faulty"
    - "out of service"
    - "out of order"
    - "not closing"
    - "not opening"
    - "not responding"
    - "not stable"
    - "not cooling"
    - "not cold"
    - "low cooling"
    - "no power"
    - "power cut"
    - "power failure"
    - "power outage"
    - "tripped"
    - "not fixed"
    - "need to fix"
    - "need to check"
    - "need to replace"
    - "needs replacement"
    - "need repair"
    - "needs repair"
    - "need to rectify"
    - "require maintenance"
    - "requires maintenance"
    - "require repair"
    - "to be fixed"
    - "to be checked"
    - "please check"
    - "kindly check"
    - "inform the concern"
    - "broken"
    - "damage"
    - "leak"
    - "crack"
    - "peeling"
    - "stuck"
    - "jammed"
    - "blinking"
    - "flickering"
    - "glowing"
    - "emergency light"
    - "emergency exit light"
    - "bad smell"
    - "not clean"

parking_violation:
  keywords:
    - "ev fast charging"
    - "non-electric"
    - "remove his car"
    - "notify concern department"
    - "charging slot"
    - "wrong parking"

vehicle_permission:
  keywords:
    - "kindly allow this vehicle"
    - "plate no"
    - "car make"
    - "vip parking slot"
    - "smart parking"
  replies:
    - "parked in vip slot"
    - "noted"

dedupe:
  method: "difflib"
  similarity_threshold: 0.85
  match_on:
    - "text_similarity"
    - "building"
    - "floor"
    - "time_proximity"
  uncertain_action: "flag_for_review"

violations_excel:
  thumbnail_max_side: 160   # pixels, longest side (configurable)
  thumbnail_quality: 70     # JPEG quality 0-95 (configurable)

