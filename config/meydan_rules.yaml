closure:
  - "done"
  - "resolved"
  - "light replaced"
  - "replaced"
  - "rectified"
  - "cleaned"
  - "mopped"
  - "cleared"
  - "area cleared"
  - "spill removed"
  - "all clear"
  # "Car multistorey building service lift now working normal" (15-10). Only with "now" / "back":
  # a plain "working normal" would also match the negated fault "not working normal".
  - "now working normal"
  - "now working normally"
  - "now working fine"
  - "now working properly"
  - "back to normal"
  - "issue resolved"
  - "normal condition"
  - "now working condition"
  - "it's fine"
  - "its fine"
  - "now it's okay"
  - "now it's ok"
  - "now its ok"
  # More ways technicians say it is fixed (owner, 15-10). "need to be / will be / to be ..." in
  # front of any of these is not a fix (is_closure_text skips it).
  - "fixed"
  - "repaired"
  - "completed"
  - "job done"
  - "work done"
  - "work completed"
  - "solved"
  - "sorted"
  - "restored"
  - "installed"
  - "changed"
  - "now ok"
  - "ok now"
  - "all ok"
  - "all good"
  - "now functioning"
  - "functioning now"
  - "has been fixed"
  - "has been done"

# Whole-message closures: only when the reply is exactly one of these.
# "working ..." phrases must NOT go in `closure` above: a fault saying "not working properly"
# would then be read as a negated closure (follow-up) and the ticket would be lost.
closure_exact:
  - "working"
  - "working now"
  - "now working"
  - "working fine"
  - "working properly"
  - "working normally"
  - "fixed"
  - "fixed now"
  - "solved"
  - "ok now"
  - "all good"

# Unquoted replies link to the open ticket sharing a word within reply_link_hours
# ("Light replaced" -> "...light not working..."), else to the latest open ticket
# within reply_link_minutes.
reply_link_hours: 12
reply_link_minutes: 60

in_progress:
  - "checking"
  - "notified to"
  - "will replace"
  - "pls check and update"
  - "is on going"
  - "is ongoing"
  - "in progress"
  - "will clean"
  - "will mop"
  - "team is checking"
  # Technicians' promises (FM history): "Will do the needful", "We will fix it as soon as possible"
  - "will do the needful"
  - "will fix"
  - "will rectify"
  - "will arrange"

# AC temperature adjustments ("increase the AC", "reduce AC") are closed automatically: the
# technician changes the setting and does not reply (owner, 16-10). Not when the message also
# reports a real fault from ac_adjust_not_if.
ac_adjust_auto_close: '\b(?:increase|reduce|decrease|raise|lower|adjust)\s+(?:the\s+)?(?:ac|a/c|a\.c|temperature|temp)\b'
ac_adjust_not_if:
  - "not working"
  - "not cooling"
  - "leak"
  - "water"
  - "noise"
  - "smell"
  - "broken"
  - "tripped"
  - "damaged"

# Fault phrases that only ask for action ("do the needful", "fix it"): they make a ticket only
# when the message also says where (building) or what (light, door, AC ...); otherwise they
# chase an earlier ticket ("Kindly do the needful asap").
fault_request_only:
  - "do the needful"
  - "fix it"
  - "please fix"
  - "kindly fix"
  - "check and fix"
  - "to fix the"
  - "rectify the issue"
  - "please inspect"
  - "please investigate"
  - "investigate and rectify"
  - "inspect and rectify"
  - "inspect and fix"
  - "need to check"
  - "need to fix"
  - "need to rectify"
  # "Dear MEP and civil Team, Kindly check the issues and update" (20-10): asks, names nothing
  - "check the issue"

followup_not_ticket:
  - "follow up"
  # "Now working . It's power trip only" (24-10): the technician explains a fix
  - "power trip only"
  - "it's power trip"
  # Reminders about a ticket already open (accuracy review 16-10)
