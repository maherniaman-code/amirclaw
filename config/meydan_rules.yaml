# Meydan Reports Automation Rules Configuration
# All configurations are editable without changing code.

groups:
  parking_multistory: "Multistory Parking Building Meydan"
  parking_team: "Parking Team at Meydan"
  fm: "Meydan FM Team💪"
  fire_safety: "Fire & Safety Team Meydan"
  operations: "Meydan - Security Team"
  cleaning: "Cleaning Matters at Meydan"   # exact WhatsApp name (group names are matched ignoring case)

# Parking capacities
capacities:
  buildings:
    P: 71
    N: 77
    M: 165
    Q: 146
    total: 459
  ramp: 127
  service_road: 127 # Used when the team leaves it out; the report shows the number they send (owner, 16-10).
  smart_parking: 887

# Time settings (Asia/Dubai)
timing:
  timezone: "Asia/Dubai"
  parking_slots: ["10:00", "12:00", "14:00"]
  freshness_window_minutes: 60
  # Reports read their period plus this many days before it (replies, carry-over of open
  # tickets). Keeps reports fast with years of imported chat history; older open tickets drop off.
  report_history_days: 30
  email_slot_tolerance_minutes: 5 # Configurable tolerance for matching email timestamp to slot (±5 mins)
  email_poll_interval_seconds: 60
  email_poll_timeout_minutes: 5
  shifts:
    day:
      start: "05:00"
      end: "17:00"
      report_time: "17:00"
    night:
      start: "17:00"
      end: "05:00"
      report_time: "05:00"

exclude:
  senders:
    - "Me (Bot Account)"
    - "أنا (حساب البوت)"
  exact_replies:
    - "noted"
    - "noted sir"
    - "ok"
    - "recorded"
    - "received"
    - "again"
    - "thanks sir"
    - "👍"
    - "clear"
    - "all clear"
    # WhatsApp placeholders (chat exports, deleted messages)
    - "this message was deleted"
    - "you deleted this message"
    - "<media omitted>"
  leave_markers:
    - "leave details"
    - "start date"
    - "staff id"
    - "staff is"
    - "emp id"
    - "total days"
    - "annual leave"
    - "taking leave"
    - "on leave"
    - "leave request"

